# Optional Render Blueprint — link a Render PostgreSQL instance in the dashboard and set
# DATABASE_URL, SECRET_KEY, ALLOWED_HOSTS, PUBLIC_API_BASE_URL, etc. before relying on this file.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: beatiq-api
    runtime: python
    plan: starter
    buildCommand: bash scripts/render_build.sh
    preDeployCommand: bash scripts/render_release.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
